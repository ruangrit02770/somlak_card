<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Business Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      font-family:'Inter',sans-serif;

      background:

        radial-gradient(
          circle at top,
          #0ea5e9 0%,
          #020617 35%
        ),

        #020617;

      min-height:100vh;

      display:flex;

      justify-content:center;

      align-items:center;

      padding:24px;

      color:white;
    }

    .card{

      width:100%;
      max-width:390px;

      background:
        linear-gradient(
          180deg,
          rgba(15,23,42,.98),
          rgba(2,6,23,1)
        );

      border-radius:38px;

      overflow:hidden;

      border:
        1px solid rgba(255,255,255,.05);

      box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        0 0 60px rgba(56,189,248,.08);

      position:relative;
    }

    .top{

      height:520px;

      position:relative;

      overflow:hidden;
    }

    .top img{

      width:100%;
      height:100%;

      object-fit:cover;

      object-position:center top;

      filter:
        contrast(1.05)
        saturate(.95)
        brightness(.92);

      transform:scale(1.02);
    }

    .overlay{

      position:absolute;

      inset:0;

      background:

        linear-gradient(
          to top,
          rgba(2,6,23,1) 10%,
          rgba(2,6,23,.72) 35%,
          rgba(2,6,23,.10) 68%
        ),

        radial-gradient(
          circle at top right,
          rgba(56,189,248,.35),
          transparent 35%
        );
    }

    .profile{

      position:absolute;

      left:28px;
      bottom:34px;

      z-index:5;
    }

    h1{

      font-size:42px;

      font-weight:800;

      line-height:.95;

      letter-spacing:-2px;
    }

    .position{

      margin-top:12px;

      color:#cbd5e1;

      font-size:16px;

      font-weight:500;
    }

    .company{

      margin-top:8px;

      color:#94a3b8;

      font-size:14px;

      font-weight:500;

      letter-spacing:.3px;
    }

    .bottom-panel{

      padding:26px 22px 24px;
    }

    .actions{

      display:flex;

      justify-content:space-between;

      gap:14px;

      margin-bottom:22px;
    }

    .icon-btn{

      flex:1;

      background:
        rgba(255,255,255,.04);

      border:
        1px solid rgba(255,255,255,.06);

      border-radius:24px;

      padding:18px 12px;

      text-decoration:none;

      display:flex;

      flex-direction:column;

      align-items:center;

      justify-content:center;

      gap:12px;

      transition:.25s;

      backdrop-filter:blur(14px);
    }

    .icon-btn:hover{

      transform:translateY(-4px);

      background:
        rgba(255,255,255,.08);
    }

    .icon-bg{

      width:52px;
      height:52px;

      border-radius:18px;

      display:flex;

      align-items:center;

      justify-content:center;

      background:
        linear-gradient(
          135deg,
          rgba(14,165,233,.18),
          rgba(37,99,235,.22)
        );

      box-shadow:
        0 0 18px rgba(14,165,233,.18);
    }

    .icon-bg i{

      font-size:22px;

      color:#7dd3fc;
    }

    .icon-btn small{

      color:#cbd5e1;

      font-size:13px;

      font-weight:600;

      letter-spacing:.3px;
    }

    .save{

      display:flex;

      align-items:center;

      justify-content:space-between;

      text-decoration:none;

      padding:18px 20px;

      border-radius:26px;

      background:
        linear-gradient(
          135deg,
          #0ea5e9,
          #2563eb
        );

      color:white;

      transition:.25s;

      box-shadow:
        0 12px 35px rgba(14,165,233,.22);
    }

    .save:hover{

      transform:translateY(-3px);

      opacity:.95;
    }

    .save-left{

      display:flex;

      align-items:center;

      gap:14px;

      font-weight:600;

      font-size:16px;
    }

    .save-icon{

      width:34px;
      height:34px;

      border-radius:50%;

      background:
        rgba(255,255,255,.18);

      display:flex;

      align-items:center;

      justify-content:center;

      font-size:22px;

      font-weight:700;
    }

    .save-arrow{

      font-size:22px;

      opacity:.9;
    }

    .footer{

      margin-top:20px;

      text-align:center;

      color:#64748b;

      font-size:11px;

      letter-spacing:1.4px;
    }

  </style>

</head>

<body>

  <div class="card">

    <div class="top">

      <img
        src="./somlak.webp"
      />

      <div class="overlay"></div>

      <div class="profile">

        <h1>
          Ruangrit<br>
          Mingsamon
        </h1>

        <div class="position">
          Leader-Developer
        </div>

        <div class="company">
          Magic Software (Thailand) Corp., Ltd.
        </div>

      </div>

    </div>

    <div class="bottom-panel">

      <div class="actions">

        <a
          class="icon-btn"
          href="tel:+66870794256"
        >

          <span class="icon-bg">
            <i class="fa-solid fa-phone"></i>
          </span>

          <small>Call</small>

        </a>

        <a
          class="icon-btn"
          href="mailto:ruangrit.m@magicsoftware.co.th"
        >

          <span class="icon-bg">
            <i class="fa-solid fa-envelope"></i>
          </span>

          <small>Email</small>

        </a>

        <a
          class="icon-btn"
          href="https://line.me/ti/p/bx7jXBOeLi"
          target="_blank"
        >

          <span class="icon-bg">
            <i class="fa-brands fa-line"></i>
          </span>

          <small>LINE</small>

        </a>

      </div>

      <a
        class="save"
        href="contact.vcf"
      >

        <div class="save-left">

          <span class="save-icon">
            +
          </span>

          <span>
            Add Contact
          </span>

        </div>

        <span class="save-arrow">
          →
        </span>

      </a>

      <div class="footer">
        BUSINESS CARD
      </div>

    </div>

  </div>

</body>

</html>
